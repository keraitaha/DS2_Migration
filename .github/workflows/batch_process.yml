name: Data Migration with Lune
on:
  workflow_dispatch: # Allows manual start

jobs:
  run-lune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Lune Manually
        shell: bash
        run: |
          curl -L https://github.com/lune-org/lune/releases/download/v0.10.4/lune-0.10.4-linux-x86_64.zip -o lune.zip
          
          sudo apt-get install -y unzip
          unzip lune.zip
          
          chmod +x lune
          sudo mv lune /usr/local/bin/lune
          
          lune --version

      - name: Run Batch Processor
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          lune run batch-process resume DS2_Migration -c examples/ds2-config.json
